<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<meta name="theme-color" content="#F5F5F7" id="themeMeta"/>
<title>MilesthoN</title>
<link href="https://lh3.googleusercontent.com/a-/ALV-UjVmECUMyqwJlVDCurpiJm9u1ZUqzh9h3NfJ8NVCaaPrPVc" rel="icon"/>
<style>
/* === ДИЗАЙН-СИСТЕМА === */
        :root {
            --bg-body: #F5F5F7;
            --surface-card: #FFFFFF;
            --surface-input: rgba(118, 118, 128, 0.12);
            --surface-input-focus: #FFFFFF;
            --bg-header: rgba(251, 251, 253, 0.85);
            
            --text-main: #1D1D1F;
            --text-sec: #86868B;
            --text-tert: #C7C7CC;
            
            --accent: #0071e3;
            --danger: #FF3B30;
            --surface-hover: #f2f2f7;
            
            --shadow-base: 0 4px 24px rgba(0, 0, 0, 0.04); 
            --shadow-lift: 0 12px 40px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0,0,0,0.02);
            --shadow-glow: 0 0 24px rgba(0, 113, 227, 0.15);
            
            --rad-l: 24px;
            --rad-m: 20px;
            
            --line: rgba(60, 60, 67, 0.1);
            --head-h: 48px;
            
            --ease-std: cubic-bezier(0.25, 0.1, 0.25, 1);
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --dur-theme: 0.3s;
            --dur-hover: 0.2s;
        }

        html.dark {
            --bg-body: #000000;
            --surface-card: #1C1C1E;
            --surface-input: rgba(118, 118, 128, 0.24);
            --surface-input-focus: #2C2C2E;
            --bg-header: rgba(28, 28, 30, 0.85);
            --surface-hover: #2c2c2e;
            
            --text-main: #F5F5F7;
            --text-sec: #98989D;
            --text-tert: #48484A;
            
            --accent: #0A84FF;
            
            --shadow-base: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-lift: 0 12px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
            --shadow-glow: 0 0 32px rgba(10, 132, 255, 0.2);
            
            --line: rgba(84, 84, 88, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 17px;
            line-height: 1.47;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            display: flex; flex-direction: column;
            min-height: 100vh;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        body {
            transition: background-color var(--dur-theme) var(--ease-std), color var(--dur-theme) var(--ease-std);
        }
        
        .main-card, .tg-card-wrapper, .support-box, .art-item, .soc-item, .tg-head, .tg-item {
            transition: background-color var(--dur-theme) var(--ease-std), 
                        box-shadow var(--dur-hover) var(--ease-std), 
                        border-color var(--dur-theme) var(--ease-std),
                        transform var(--dur-hover) var(--ease-spring);
        }
        
        .heart, #heart { transition-property: transform, opacity; }

        a { text-decoration: none; color: inherit; cursor: pointer; }
        button { background: none; border: none; cursor: pointer; color: inherit; font-family: inherit; }
        img { display: block; max-width: 100%; }

        ::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(128, 128, 128, 0.3); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(128, 128, 128, 0.5); }

        /* === ШАПКА === */
        .globalnav {
            position: fixed; top: 0; left: 0; right: 0; height: var(--head-h);
            z-index: 9999;
            background-color: var(--bg-header);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--line);
            transition: background-color var(--dur-theme) var(--ease-std), border-color var(--dur-theme) var(--ease-std);
        }
        
        .nav-container {
            max-width: 1024px; margin: 0 auto; height: 100%; padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo {
            font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
            color: var(--text-main); opacity: 0.9; letter-spacing: -0.01em;
        }
        .logo img { width: 16px; height: 16px; border-radius: 50%; }
        .logo:hover { opacity: 1; }

        .nav-menu { display: flex; gap: 32px; }
        .nav-item { font-size: 13px; color: var(--text-sec); font-weight: 500; transition: color 0.2s; }
        .nav-item:hover { color: var(--text-main); }
        .nav-item.active { color: var(--text-main); font-weight: 600; }

        .nav-right { display: flex; align-items: center; gap: 16px; } 
        .theme-btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            opacity: 0.5; border-radius: 50%; color: var(--text-main);
            transition: opacity 0.2s, color 0.3s;
        }
        .theme-btn:hover { opacity: 1; }
        .burger-btn { display: none; color: var(--text-main); }

        /* === ОСНОВНОЙ КОНТЕЙНЕР === */
        main {
            margin-top: var(--head-h);
            flex: 1; padding-bottom: 32px;
        }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 0 12px; }

        /* === ГЛАВНАЯ: СЕТКА КАРТОЧЕК === */
        .grid-home { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 64px; }
        .col-2 { grid-column: span 2; }
        .col-1 { grid-column: span 1; }

        .main-card {
            background: var(--surface-card);
            border-radius: var(--rad-l);
            padding: 30px; 
            box-shadow: var(--shadow-base);
            display: flex; flex-direction: column; gap: 24px;
            position: relative; overflow: hidden; cursor: pointer; z-index: 1;
        }
        .main-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lift); z-index: 2; }
        .main-card::after {
            content: ''; position: absolute; inset: 0; border-radius: var(--rad-l);
            box-shadow: inset 0 0 0 0 rgba(255,255,255,0); pointer-events: none;
            transition: box-shadow 0.4s ease;
        }
        .main-card:hover::after { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }

        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-h { font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
        .card-more { font-size: 14px; color: var(--text-sec); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .main-card:hover .card-more { color: var(--accent); }
        .card-more svg { transition: transform 0.3s var(--ease-std); }
        .main-card:hover .card-more svg { transform: translateX(4px); }

        /* === МИНИ-СЕТКИ: TELEGRAM И СОЦСЕТИ === */
        .tg-mini-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px;
            padding: 2px;
        }
        .tg-mini-item {
            background: var(--surface-input); border-radius: 16px; padding: 14px;
            display: flex; justify-content: space-between; position: relative; overflow: hidden;
            color: var(--text-main);
            transition: background-color var(--dur-theme), transform 0.2s, box-shadow 0.2s;
        }
        .tg-mini-item:hover { 
            background: var(--surface-input-focus); 
            transform: scale(1.015); 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
        }
        
        .tg-m-lg { grid-column: span 2; grid-row: span 2; flex-direction: column; padding: 20px; }
        .tg-m-lg .emoji { font-size: 44px; margin-bottom: 4px; }
        .tg-m-lg .name { font-size: 17px; font-weight: 600; }
        
        .tg-m-row { grid-column: span 2; align-items: center; justify-content: flex-start; gap: 14px; padding: 0 20px; height: 64px; }
        .tg-m-row .emoji { font-size: 24px; }
        .tg-m-row .name { font-size: 14px; font-weight: 600; }

        .tg-m-trip { grid-column: span 4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .tg-m-small { align-items: center; justify-content: flex-start; gap: 12px; padding: 0 18px; height: 64px; }
        .tg-m-small .emoji { font-size: 22px; }
        .tg-m-small .name { font-size: 13px; font-weight: 600; }

        .soc-mini-grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 24px; justify-content: center; padding: 2px; }
        .soc-m-item { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 64px; }
        .soc-m-box {
            width: 64px; height: 64px; background: var(--surface-input); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
            transition: transform 0.2s, background-color var(--dur-theme), box-shadow 0.2s;
        }
        .soc-m-item:hover .soc-m-box { background: var(--surface-input-focus); transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .soc-m-label { font-size: 12.5px; color: var(--text-sec); text-align: center; line-height: 1.25; }
        html.dark a[href*="github.com"] .soc-m-box img { filter: invert(1); }

        /* === HERO (ЗАГОЛОВОК СТРАНИЦЫ) === */
        .hero { padding: 48px 0 64px; text-align: center; }
        .hero-h { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; line-height: 1.2; }
        .hero-back { position: relative; padding-left: 24px; cursor: pointer; transition: color 0.2s; }
        .hero-back::before { content: "‹"; position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-weight: 600; transition: transform 0.3s; }
        .hero-back:hover { color: var(--accent); }
        .hero-back:hover::before { transform: translateY(-50%) translateX(-4px); }
        
        .hero-sub { font-size: 21px; color: var(--text-sec); max-width: 640px; margin: 0 auto; line-height: 1.4; }
        .disclaimer {
            display: inline-flex; margin-top: 32px; padding: 8px 16px;
            background: var(--surface-input); color: var(--text-sec); font-size: 12px; font-weight: 500; border-radius: 16px;
        }

        .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; padding: 0 4px; }
        .sec-title { font-size: 24px; font-weight: 700; }

        /* === СТРАНИЦА TELEGRAM === */
        .tg-split { 
            display: flex; gap: 24px; max-width: 1024px; margin: 0 auto; padding: 0 24px 80px; 
            align-items: flex-start;
        }
        
        .tg-col-l { 
            flex: 0 0 320px; 
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        
        .tg-card-wrapper {
            background: var(--surface-card); 
            border-radius: var(--rad-l); 
            box-shadow: var(--shadow-base);
            overflow: hidden; 
            display: flex; flex-direction: column;
            height: 100%;
        }
        
        .tg-head {
            padding: 24px; border-bottom: 1px solid var(--line); background: var(--surface-card);
            display: flex; align-items: center; gap: 16px; z-index: 2; cursor: pointer; flex-shrink: 0;
        }
        .tg-head:hover .tg-arr-head { color: var(--accent); }
        
        .tg-titles { flex: 1; }
        .tg-t-main { font-size: 19px; font-weight: 700; line-height: 1; }
        .tg-t-sub { font-size: 14px; color: var(--text-sec); margin-top: 2px; }
        .tg-arr-head { font-size: 22px; color: var(--text-tert); transition: color 0.2s; }

        .tg-list-wrap { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0;
        }
        .tg-list-wrap::-webkit-scrollbar { width: 4px; }
        .tg-list-wrap::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.2); border-radius: 4px; }

        .tg-col-r { 
            flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; 
        }

        .tg-item {
            background: var(--surface-card); border-radius: var(--rad-m); padding: 16px 20px;
            display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-base);
            position: relative; overflow: hidden; cursor: pointer; text-align: left;
        }
        .tg-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); z-index: 2; }
        .tg-item:hover::after { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); } 
        
        .tg-item.main { padding: 24px; min-height: 140px; border-radius: var(--rad-l); }
        .tg-item.main .emoji { font-size: 56px; margin: 0; }
        .tg-item.main .t-lg { font-size: 24px; margin-bottom: 6px; }
        .tg-item.main .t-sm { font-size: 16px; }

        .tg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        
        .tg-item .emoji { font-size: 32px; margin: 0; width: 40px; text-align: center; flex-shrink: 0; }
        .tg-item .info { flex: 1; min-width: 0; }
        .tg-item .t-lg { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .tg-item .t-sm { font-size: 13px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tg-item .arr { font-size: 18px; color: var(--text-tert); transition: color 0.2s; }
        .tg-item:hover .arr { color: var(--accent); }

        /* === СПИСКИ (СТИЛЬ) === */
        .ios-list { background: var(--surface-card); display: flex; flex-direction: column; }
        .ios-row {
            display: flex; align-items: center; padding: 10px 16px; min-height: 48px;
            color: var(--text-main); position: relative; cursor: pointer;
        }
        .ios-row:active { background: var(--surface-hover); }
        
        .ios-row:not(:last-child)::after {
            content: ''; position: absolute; bottom: 0; right: 16px; left: 54px;
            height: 1px; background: var(--line);
        }
        .support-box .ios-row { padding: 16px 20px; }
        .support-box .ios-row:not(:last-child)::after { left: 76px; right: 20px; }

        .ios-icon-e { width: 24px; height: 24px; font-size: 18px; margin-right: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ios-img { width: 40px; height: 40px; border-radius: 10px; margin-right: 16px; object-fit: cover; }

        .ios-data { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-right: 10px; }
        .ios-name { font-size: 13.5px; font-weight: 500; line-height: 1.2; }
        .support-box .ios-name { font-size: 16px; }
        .ios-desc { font-size: 14px; color: var(--text-sec); }

        .ios-act { color: var(--text-tert); display: flex; align-items: center; }
        .ios-row:hover .ios-act { color: var(--accent); }
        .ios-arrow { font-size: 18px; font-weight: 400; }

        .heart-ic { width: 24px; height: 24px; transition: color 0.3s; }
        .ios-row:hover .heart-ic { color: var(--danger); animation: pulse 0.5s ease-in-out; }
        .copy-ic { width: 20px; height: 20px; opacity: 0.5; transition: 0.2s; }
        .ios-row:hover .copy-ic { opacity: 1; color: var(--text-main); transform: scale(1.1); }
        @keyframes pulse {
		  0% { transform: scale(1); }
		  15% { transform: scale(1.25); }
		  30% { transform: scale(1); }
		  45% { transform: scale(1.15); }
		  60% { transform: scale(1); }
		  100% { transform: scale(1); }
		}

        /* === СТРАНИЦА СОЦСЕТИ === */
        .soc-grid-pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 1024px; margin: 0 auto; justify-content: center; padding: 0 12px; }
        .soc-item {
            background: var(--surface-card); padding: 16px 20px; border-radius: 20px;
            display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-base);
            cursor: pointer; border: 1px solid transparent;
        }
        .soc-item:hover { transform: scale(1.02); box-shadow: var(--shadow-lift); border-color: rgba(0,0,0,0.05); }
        html.dark .soc-item:hover { border-color: rgba(255,255,255,0.1); }
        
        .soc-p-ava { width: 44px; height: 44px; border-radius: 12px; }
        html.dark a[href*="github.com"] .soc-p-ava { filter: invert(1); }
        .soc-p-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .soc-p-arr { font-size: 24px; color: var(--text-tert); transition: 0.3s; }
        .soc-item:hover .soc-p-arr { color: var(--accent); }

        /* === СТРАНИЦА ПОДДЕРЖАТЬ === */
        .support-box { max-width: 600px; margin: 0 12px; background: var(--surface-card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-base); }
        @media (min-width: 624px) { .support-box { margin: 0 auto; } }

        /* === СТАТЬИ === */
        .art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .art-item {
            background: var(--surface-card); border-radius: var(--rad-l); box-shadow: var(--shadow-base);
            display: flex; flex-direction: column; height: 100%; cursor: pointer; position: relative; overflow: hidden;
        }
        .art-item:hover { transform: translateY(-6px); box-shadow: var(--shadow-lift); z-index: 2; }
        .art-item.dashed { border: 2px dashed var(--line); background: transparent; box-shadow: none; opacity: 0.8; }
        
        .art-pin { position: absolute; top: 16px; right: 16px; background: var(--surface-input); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .art-cover { flex: 1; padding: 22px; position: relative; overflow: hidden; min-height: 100px; }
        .art-bg { position: absolute; bottom: -10px; right: -10px; font-size: 90px; opacity: 0.08; transform: rotate(-15deg); transition: 0.4s var(--ease-std); }
        .art-item:hover .art-bg { transform: rotate(0deg) scale(1.1); opacity: 0.12; }
        
        .art-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; line-height: 1.2; position: relative; }
        .art-item.pinned .art-title { padding-right: 40px; } 
        
        .art-desc { font-size: 15px; color: var(--text-sec); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; position: relative; }
        
        .art-bot {
            padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
            background: rgba(127, 127, 127, 0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
        }
        .art-cat { font-size: 11px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; }
        .art-date { font-size: 12px; font-weight: 600; color: var(--text-sec); }
        .art-btn {
            background: var(--surface-input); color: var(--accent); font-size: 13px; font-weight: 600;
            padding: 8px 16px; border-radius: 16px; transition: 0.3s;
        }
        .art-item:hover .art-btn { background: var(--accent); color: white; box-shadow: var(--shadow-glow); }

        /* === ЧТЕНИЕ СТАТЬИ === */
        .reader { max-width: 720px; margin: 0 auto; padding-bottom: 80px; }
        .rh-center { margin-bottom: 32px; padding: 0 16px; text-align: left; }
        .rh-head-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
        .rh-icon { font-size: 48px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1)); flex-shrink: 0; }
        .rh-h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; margin: 0; line-height: 1.2; word-wrap: break-word; overflow-wrap: break-word; hyphens: auto; }
        .rh-meta-wrap { text-align: center; }
        .rh-meta { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-input); padding: 6px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; }
        
        .prose { font-size: 17px; line-height: 1.5; opacity: 0.95; padding: 0 8px; }
        .prose h1 { font-size: 24px; margin: 16px 0 8px; }
        .prose h3 { font-size: 20px; margin: 12px 0 6px; }
        .prose p { margin-bottom: 10px; color: var(--text-sec); }
        .prose blockquote { border-left: 3px solid var(--accent); background: var(--surface-input); padding: 10px 14px; border-radius: 0 12px 12px 0; margin: 10px 0; font-style: italic; font-size: 0.95em; }
        .prose a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
        .prose code.inline-code { font-family: ui-monospace, monospace; font-size: 0.9em; background: var(--surface-input); padding: 2px 6px; border-radius: 8px; border: 1px solid var(--line); }
        .prose pre { margin: 10px 0; padding: 12px; background: var(--surface-input); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
        .prose pre code { display: block; white-space: pre; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.45; color: var(--text-main); }

        .code-block { position: relative; margin: 10px 0; }
        .copy-btn { position: absolute; top: 8px; right: 8px; border: 1px solid var(--line); background: var(--surface-card); color: var(--text-sec); border-radius: 10px; padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: transform var(--dur-hover) var(--ease-std), background var(--dur-hover) var(--ease-std); user-select: none; }

        const parseMd = (t) => {
            t = (t || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const blocks = [];
            t = t.replace(/```([a-zA-Z0-9_-]+)?\n([\s\S]*?)```/g, (m, lang, code) => {
                const id = blocks.length;
                blocks.push({ lang: (lang || '').trim(), code: code || '' });
                return `@@CODEBLOCK_${id}@@`;
            });
            t = escapeHtml(t);
            t = t
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>');
            t = t.replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>');
            t = t
                .replace(/\*\*(.+?)\*\*/gim, '<strong>$1</strong>')
                .replace(/__(.+?)__/gim, '<em>$1</em>')
                .replace(/\+\+(.+?)\+\+/gim, '<u>$1</u>')
                .replace(/~~(.+?)~~/gim, '<s>$1</s>')
                .replace(/`([^`]+?)`/gim, '<code class="inline-code">$1</code>');
            t = t.replace(/\n/gim, '<br>');
            t = t.replace(/@@CODEBLOCK_(\d+)@@/g, (m, idx) => {
                const b = blocks[Number(idx)];
                const langClass = b.lang ? `language-${b.lang}` : '';
                const codeEsc = escapeHtml((b.code || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'));
                return `
<div class="code-block">
    <button class="copy-btn" type="button" data-copy>Copy</button>
    <pre><code class="${langClass}">${codeEsc}</code></pre>
</div>`.trim();
            });
            return t;
        };

        const copyToClipboard = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }
            } catch (e) { console.error(e); }
            
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'absolute';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        };

        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-copy]');
            if (!btn) return;
            const parent = btn.parentElement;
            const code = parent && parent.querySelector('pre code');
            if (!code) return;
            const old = btn.innerText;
            btn.innerText = '...';
            try {
                await copyToClipboard(code.innerText);
                btn.innerText = 'Скопировано';
            } catch (err) {
                btn.innerText = 'Ошибка';
            } finally {
                setTimeout(() => (btn.innerText = old), 1400);
            }
        });

        /* === КОМПОНЕНТЫ === */
        const Hero = (t, s, w) => `
            <div class="hero">
                <div class="hero-h">${t}</div>
                ${s ? `<div class="hero-sub">${s}</div>` : ''}
                ${w ? `<div class="disclaimer">${w}</div>` : ''}
            </div>`;

        const ArtCard = (a) => {
            const click = a.link ? `window.open('${a.link}','_blank')` : `location.href='#/wall/${a.slug?`${a.tagId}/`+a.slug:''}'`;
            const btn = a.link ? 'Перейти ↗' : ((a.btnText && a.btnText !== 'None') ? a.btnText : 'Читать');
            return `
            <div class="art-item ${a.isDashed?'dashed':''} ${a.pinned?'pinned':''}" onclick="${click}">
                ${a.pinned ? '<div class="art-pin" title="Закреплено">📌</div>' : ''}
                <div class="art-cover">
                    <div class="art-bg">${a.emoji}</div>
                    <div class="art-title">${a.title}</div>
                    <div class="art-desc">${a.desc}</div>
                </div>
                <div class="art-bot">
                    <div class="art-meta">
                        <div class="art-cat">${a.category}</div>
                        <div class="art-date">${a.date||''}</div>
                    </div>
                    <div class="art-btn">${btn}</div>
                </div>
            </div>`;
        };

        /* === СТРАНИЦЫ === */
        function renderHome() {
            const [m, ...rest] = tgData;
            const pinned = { slug: 'soon', title: 'скоро?', desc: 'возможно когда то здесь что то будет', emoji: '⏳', category: 'анонс', isDashed: true, pinned: false, btnText: 'None', tagId: 0, date: '...' };
            const artDataTags = artData.map(a => ({ ...a, tagId: ['Все',...new Set(artData.map(x=>x.category))].indexOf(a.category) }));

            const midItems = rest.slice(0, 4); 
            const botItems = rest.slice(4, 7);

            return `
                ${Hero('Ссылки на полезные источники', 'В одном месте', 'Вся информация несет ознакомительный характер и не призывает к противозаконным действиям.')}
                <div class="container">
                    <div class="grid-home">
                        <div class="main-card col-2" onclick="location.href='#/telegram'">
                            <div class="card-top">
                                <span class="card-h">Telegram Каналы</span>
                                <div class="card-more">Все <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 1l6 6-6 6"/></svg></div>
                            </div>
                            <div class="tg-mini-grid">
                                <a href="${m.url}" target="_blank" class="tg-mini-item tg-m-lg" onclick="event.stopPropagation()">
                                    <div class="emoji">${m.emoji}</div><div class="name">${m.name}</div>
                                </a>
                                ${midItems.map(c => `<a href="${c.url}" target="_blank" class="tg-mini-item tg-m-row" onclick="event.stopPropagation()"><div class="emoji">${c.emoji}</div><div class="name">${c.name}</div></a>`).join('')}
                                <div class="tg-m-trip" onclick="event.stopPropagation()">
                                    ${botItems.map(c => `<a href="${c.url}" target="_blank" class="tg-mini-item tg-m-small" onclick="event.stopPropagation()"><div class="emoji">${c.emoji}</div><div class="name">${c.name}</div></a>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="main-card col-1" onclick="location.href='#/socials'">
                            <div class="card-top">
                                <span class="card-h">Соцсети</span>
                                <div class="card-more">Все <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 1l6 6-6 6"/></svg></div>
                            </div>
                            <div class="soc-mini-grid">
                                ${socData.map(s => `<a href="${s.url}" target="_blank" class="soc-m-item" onclick="event.stopPropagation()"><div class="soc-m-box"><img src="${iconUrl(s.domain)}" alt="${s.name}"></div><div class="soc-m-label">${s.name}</div></a>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="sec-head"><span class="sec-title">Последние статьи</span></div>
                    <div class="art-grid">
                        ${ArtCard(pinned)}
                        ${artDataTags.map(ArtCard).join('')}
                    </div>
                </div>`;
        }

        function renderTelegram() {
            const [main, ...others] = tgData;
            const usefulInfo = tgData.find(x => x.id === 'useful'); 
            const rest = others.slice(1); 

            return `
                ${Hero('Telegram Каналы')}
                <div class="tg-split">
                    <div class="tg-col-l" id="tgColL">
                        <div class="tg-card-wrapper" id="tgCardL">
                            <a href="https://t.me/isNEEDs" target="_blank" class="tg-head">
                                <div class="emoji" style="font-size:40px; margin:0">${usefulInfo ? usefulInfo.emoji : '✨'}</div>
                                <div class="tg-titles">
                                    <div class="tg-t-main">Полезное</div>
                                    <div class="tg-t-sub">подборка находок</div>
                                </div>
                                <div class="tg-arr-head">↗</div>
                            </a>
                            <div class="tg-list-wrap">
                                <div class="ios-list">
                                    ${usefulData.map(u => `
                                        <a href="${u.url}" target="_blank" class="ios-row">
                                            <div class="ios-icon-e">${u.emoji}</div>
                                            <div class="ios-data">
                                                <div class="ios-name">${u.name}</div>
                                            </div>
                                            <div class="ios-act">
                                                <div class="ios-arrow">›</div>
                                            </div>
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="tg-col-r" id="tgColR">
                        <a href="${main.url}" target="_blank" class="tg-item main">
                            <div class="emoji">${main.emoji}</div>
                            <div class="info">
                                <div class="t-lg">${main.name}</div>
                                <div class="t-sm">${main.desc}</div>
                            </div>
                            <div class="arr" style="font-size:24px">↗</div>
                        </a>
                        <div class="tg-grid">
                            ${rest.map(c => `
                                <a href="${c.url}" target="_blank" class="tg-item">
                                    <div class="emoji">${c.emoji}</div>
                                    <div class="info">
                                        <div class="t-lg">${c.name}</div>
                                        <div class="t-sm">${c.desc}</div>
                                    </div>
                                    <div class="arr">↗</div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderSocials() {
            return `
                ${Hero('Социальные сети')}
                <div class="soc-grid-pg">
                    ${socData.map(s => `
                        <a href="${s.url}" target="_blank" class="soc-item">
                            <img src="${iconUrl(s.domain)}" class="soc-p-ava">
                            <div class="soc-p-name">${s.name}</div>
                            <div class="soc-p-arr">›</div>
                        </a>
                    `).join('')}
                </div>
                <div style="text-align:center; font-size:12px; color:var(--text-sec); padding: 12px;">* Признана экстремистской организацией и запрещена в РФ.</div>`;
        }

        function renderSupport() {
            return `
                ${Hero('Поддержать')}
                <div class="support-box">
                    <div class="ios-list ios-list-support">
                        ${supportData.map(s => {
                            const isCopy = s.type === 'copy';
                            const onClick = isCopy ? `onclick="navigator.clipboard.writeText('${s.value}').then(() => alert('Номер скопирован: ${s.value}')); return false;"` : '';
                            const href = isCopy ? '#' : s.url;
                            const target = isCopy ? '' : 'target="_blank"';
                            const icon = isCopy 
                                ? `<svg class="copy-ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>` 
                                : `<svg class="heart-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                            return `
                            <a href="${href}" ${target} ${onClick} class="ios-row">
                                <img src="${iconUrl(s.domain)}" class="ios-img">
                                <div class="ios-data">
                                    <div class="ios-name">${s.name}</div>
                                    ${s.desc ? `<div class="ios-desc">${s.desc}</div>` : ''}
                                </div>
                                <div class="ios-act">${icon}</div>
                            </a>`;
                        }).join('')}
                    </div>
                </div>
                <div style="text-align:center; font-size:13px; color:var(--text-sec); padding: 20px; opacity: 0.6;">*Спасибо за поддержку ❤️</div>`;
        }

        function renderWall(tagId, slug) {
            const categories = ['Все', ...new Set(artData.map(a => a.category))];
            const tId = tagId ? parseInt(tagId) : 0;
            const curTag = categories[tId] || 'Все';
            const ads = artData.map(a => ({ ...a, tagId: categories.indexOf(a.category) }));

            const sb = `
                <aside class="sidebar">
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M15 15l-4-4"/></svg>
                        <input type="text" class="input-field" id="artSearch" placeholder="Найти...">
                        <div class="search-clear" id="searchClear" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); width:20px; height:20px; background:#8e8e93; border-radius:50%; color:white; display:none; align-items:center; justify-content:center; cursor:pointer;"><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l8 8M9 1L1 9"/></svg></div>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;">
                        ${categories.map((c, i) => `<div class="nav-link ${i===tId?'active':''}" style="padding:6px 14px; border-radius:18px; background:var(${i===tId?'--text-main':'--surface-input'}); color:var(${i===tId?'--surface-card':'--text-sec'})" onclick="location.href='#/wall/${i}'">${c}</div>`).join('')}
                    </div>
                    <div class="nav-list" id="artNav">
                        ${ads.map(a => `<div onclick="${a.link?`window.open('${a.link}')`:`location.href='#/wall/${a.tagId}/${a.slug}'`}" class="nav-link ${a.link ? 'external' : ''} ${(!a.link && a.slug===slug)?'active':''}" style="display:${(curTag==='Все'||a.category===curTag)?'block':'none'}"><span>${a.title}</span>${a.link?'<span class="nav-arr">↗</span>':''}</div>`).join('')}
                    </div>
                </aside>`;
            
            let content = '';
            let hh = '';

            if(!slug) {
                hh = (curTag === 'Все') ? Hero('Статьи', curTag) : `<div class="hero"><div class="hero-h"><a href="#/wall/0" class="hero-back">Статьи</a></div><div class="hero-sub">${curTag}</div></div>`;
                content = `<div class="art-grid" id="mainGrid">${ads.filter(a => curTag==='Все' || a.category===curTag).map(ArtCard).join('')}</div>`;
            } else {
                const a = ads.find(x => x.slug === slug);
                if(a) {
                    hh = `<div class="hero"><div class="hero-h"><a href="#/wall/0" class="hero-back">Статьи</a></div><div class="hero-sub"><a href="#/wall/${tId}" class="hero-back" style="font-size:21px">${a.category}</a></div></div>`;
                    content = `
                    <div class="reader">
                        <div class="rh-center">
                            <div class="rh-head-row">
                                <span class="rh-icon">${a.emoji}</span>
                                <h1 class="rh-h1">${a.title}</h1>
                            </div>
                            <div class="rh-meta-wrap">
                                <div class="rh-meta"><span>${a.category}</span><span style="margin:0 8px; opacity:0.4">●</span><span>${a.date}</span></div>
                            </div>
                        </div>
                        <div class="prose">${parseMd(a.content)}</div>
                    </div>`;
                } else { return render404(); }
            }
            return `${hh}<div class="container docs-layout">${sb}<div class="content-col" id="contentArea">${content}</div></div>`;
        }

        function render404() {
            return `<div class="not-found"><div class="nf-emoji">😵‍💫</div><div class="nf-title">Страница не найдена</div><a href="#/" class="nf-btn">На главную</a></div>`;
        }

        /* === РОУТЕР И ЛОГИКА === */
        const app = document.getElementById('app');
        const themeBtn = document.getElementById('themeBtn');
        const menuBtn = document.getElementById('menuBtn');
        const mobMenu = document.getElementById('mobMenu');
        const themeMeta = document.getElementById('themeMeta');

        const icons = {
            sun: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="4"/><path d="M9 1v2M9 15v2M3.3 3.3l1.4 1.4M13.3 13.3l1.4 1.4M1 9h2M15 9h2M3.3 14.7l1.4-1.4M13.3 4.7l1.4-1.4"/></svg>`,
            moon: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 9.6A7 7 0 1 1 8.4 3 5.5 5.5 0 0 0 15 9.6z"/></svg>`
        };

        const getTheme = () => localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        function setTheme(t) {
            document.documentElement.classList.toggle('dark', t === 'dark');
            themeBtn.innerHTML = t === 'dark' ? icons.sun : icons.moon;
            themeMeta.content = t === 'dark' ? '#000000' : '#F5F5F7';
        }
        let curTheme = getTheme(); setTheme(curTheme);

        themeBtn.onclick = () => { curTheme = curTheme === 'dark' ? 'light' : 'dark'; setTheme(curTheme); localStorage.setItem('theme', curTheme); };

        function setupSearch() {
            const inp = document.getElementById('artSearch');
            if(!inp) return;
            const clr = document.getElementById('searchClear');
            const cats = ['Все', ...new Set(artData.map(a => a.category))];
            const curT = cats[parseInt(window.location.hash.split('/')[2])||0] || 'Все';
            const doSearch = () => {
                const v = inp.value.toLowerCase();
                clr.style.display = v ? 'flex' : 'none';
                const f = artData.map(a=>({...a, tagId:cats.indexOf(a.category)})).filter(a => (curT==='Все'||a.category===curT) && (a.title.toLowerCase().includes(v)||a.desc.toLowerCase().includes(v)));
                document.getElementById('contentArea').innerHTML = `<div class="art-grid">${f.map(ArtCard).join('')}</div>`;
                Array.from(document.getElementById('artNav').children).forEach(r => {
                    const t = r.querySelector('span:first-child').innerText;
                    r.style.display = f.find(x=>x.title===t) ? 'flex' : 'none';
                });
            };
            inp.oninput = doSearch;
            clr.onclick = () => { inp.value = ''; doSearch(); };
        }

        let ro = null;
        const router = () => {
            if(ro) { ro.disconnect(); ro = null; }
            const h = window.location.hash || '#/';
            const [_, root, p1, p2] = h.split('/');
            const path = '/' + (root || '');
            
            if(path === '/') app.innerHTML = renderHome();
            else if(path === '/telegram') {
                app.innerHTML = renderTelegram();
                const l = document.getElementById('tgColL');
                const r = document.getElementById('tgColR');
                if(l && r && window.innerWidth > 768 && ('ResizeObserver' in window)) {
                    ro = new ResizeObserver(() => {
                        if(window.innerWidth > 768) l.style.height = r.offsetHeight + 'px';
                        else l.style.height = ''; 
                    });
                    ro.observe(r);
                }
            }
            else if(path === '/socials') app.innerHTML = renderSocials();
            else if(path === '/support') app.innerHTML = renderSupport();
            else if(path === '/wall') { app.innerHTML = renderWall(p1, p2); setupSearch(); }
            else app.innerHTML = render404();
            
            document.querySelectorAll('.nav-item').forEach(l => l.classList.toggle('active', l.getAttribute('href').includes(path) && path !== '/'));
        };

        menuBtn.onclick = () => mobMenu.classList.toggle('open');
        document.querySelectorAll('.mob-link').forEach(l => l.onclick = () => mobMenu.classList.remove('open'));
        document.getElementById('heartWrap').ondblclick = function() { const h = document.getElementById('heart'); h.classList.remove('anim'); void h.offsetWidth; h.classList.add('anim'); };

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);
        window.addEventListener('resize', () => { if(window.location.hash.includes('telegram')) router(); });
    </script>
</body>
</html>
